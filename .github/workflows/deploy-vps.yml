name: Deploy frontend to VPS

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="/home/${{ secrets.VPS_USER }}/ruta-segura-web"
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "No se encontró un repo Git en: $APP_DIR"
              echo "Contenido del home del usuario:"
              ls -la "/home/${{ secrets.VPS_USER }}" || true
              exit 1
            fi

            cd "$APP_DIR"
            git fetch origin deploy
            git reset --hard origin/deploy
            docker compose up -d --build
            docker image prune -f
